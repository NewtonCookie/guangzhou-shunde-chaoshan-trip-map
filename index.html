<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>广州 · 顺德 · 汕头 3 日吃喝地图</title>

<style>
:root {
  --paper: #f7f3ec;
  --paper-deep: #efe8dc;
  --card: rgba(255, 253, 249, .94);
  --ink: #25201b;
  --muted: #716960;
  --faint: #9f968d;
  --line: rgba(64, 51, 39, .12);
  --red: #c44932;
  --orange: #dc7b2d;
  --green: #44725b;
  --blue: #346f86;
  --purple: #785889;
  --shadow: 0 10px 34px rgba(67, 47, 29, .09);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); }
body {
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 2%, rgba(220,123,45,.11), transparent 27rem),
    linear-gradient(180deg, #faf7f1 0%, var(--paper) 48%, #f4eee5 100%);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
a { color: inherit; }
button { font: inherit; }

#map {
  width: 100%;
  height: 38vh;
  min-height: 290px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--paper-deep);
}
.tabs {
  position: sticky;
  top: 38vh;
  z-index: 99;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 11px 14px;
  background: rgba(250,247,241,.88);
  border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  border: 0;
  border-radius: 999px;
  padding: 8px 15px;
  background: rgba(75,60,46,.07);
  color: var(--muted);
  font-size: 14px;
  font-weight: 680;
  cursor: pointer;
  transition: transform .2s, background .2s, color .2s;
}
.tab:active { transform: scale(.96); }
.tab.active { color: #fff; background: var(--ink); }

.content {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 18px 15px calc(30px + var(--safe-bottom));
}
.hero {
  padding: 22px 4px 18px;
}
.eyebrow {
  margin-bottom: 8px;
  color: var(--red);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
}
.hero h1 {
  max-width: 620px;
  font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  font-size: clamp(30px, 7vw, 46px);
  line-height: 1.08;
  letter-spacing: -.035em;
}
.hero p {
  margin-top: 11px;
  color: var(--muted);
  font-size: 16px;
}
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.info-card, .callout, .route-bar, .card, .source-card {
  border: 1px solid rgba(87,64,43,.08);
  background: var(--card);
  box-shadow: var(--shadow);
}
.info-card {
  min-height: 104px;
  border-radius: 18px;
  padding: 15px;
}
.info-card .label {
  margin-bottom: 7px;
  color: var(--faint);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .055em;
}
.info-card .value {
  font-size: 15px;
  font-weight: 760;
  line-height: 1.35;
}
.section-head {
  padding: 24px 3px 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: .09em;
}
.callout {
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 10px;
}
.callout strong {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
}
.callout p { color: var(--muted); font-size: 14px; }
.callout.danger { border-left: 4px solid var(--red); }
.callout.safe { border-left: 4px solid var(--green); }
.download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  color: var(--red);
  font-size: 13px;
  font-weight: 760;
  text-decoration: none;
}
.day-list { display: grid; gap: 9px; }
.day-link {
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 17px;
  padding: 15px 16px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.day-link .top {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 16px;
  font-weight: 780;
}
.day-link .dot { width: 9px; height: 9px; border-radius: 50%; }
.day-link .sub { margin: 4px 0 0 18px; color: var(--muted); font-size: 13px; }

.day-head { padding: 19px 3px 11px; }
.day-head .kicker { color: var(--red); font-size: 12px; font-weight: 800; }
.day-head h2 {
  margin-top: 3px;
  font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  font-size: 29px;
  line-height: 1.18;
  letter-spacing: -.025em;
}
.day-head p { margin-top: 5px; color: var(--muted); font-size: 14px; }
.route-bar {
  margin: 4px 0 15px;
  border-radius: 16px;
  padding: 13px 15px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}
.route-bar strong { color: var(--ink); }
.timeline {
  position: relative;
  padding-left: 25px;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 18px;
  bottom: 18px;
  width: 1px;
  background: rgba(80,61,42,.18);
}
.tl-item { position: relative; margin-bottom: 11px; }
.tl-dot {
  position: absolute;
  top: 19px;
  left: -22px;
  z-index: 1;
  width: 11px;
  height: 11px;
  border: 2px solid var(--paper);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(70,54,39,.08);
}
.tl-dot.food { background: var(--red); }
.tl-dot.spot { background: var(--blue); }
.tl-dot.drink { background: var(--purple); }
.tl-dot.hotel { background: var(--orange); }
.tl-dot.transport { background: var(--faint); }
.card {
  border-radius: 17px;
  padding: 15px 16px;
}
.card .time {
  color: var(--red);
  font-size: 12px;
  font-weight: 820;
  letter-spacing: .02em;
}
.card .name {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 3px 0 5px;
  font-size: 17px;
  font-weight: 780;
}
.badge {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 900;
}
.badge.food { color: var(--red); background: rgba(196,73,50,.11); }
.badge.spot { color: var(--blue); background: rgba(52,111,134,.11); }
.badge.drink { color: var(--purple); background: rgba(120,88,137,.11); }
.card .desc { color: var(--muted); font-size: 14px; }
.detail {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}
.chips, .links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.chip {
  border-radius: 999px;
  padding: 4px 9px;
  background: rgba(74,58,43,.07);
  color: var(--muted);
  font-size: 11px;
  font-weight: 730;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 40px;
  border: 0;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 820;
  text-decoration: none;
  cursor: pointer;
}
.btn:active { filter: brightness(.9); }
.btn.amap { color: #fff; background: #1b73e8; }
.btn.dp { color: #fff; background: #e99110; }
.btn.xhs { color: #fff; background: #e53a51; }
.alt-note { color: var(--faint); font-size: 12px; }
.source-card {
  border-radius: 16px;
  padding: 14px 15px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;

.source-card a { color: var(--red); font-weight: 700; }

.leaflet-popup-content-wrapper {
  border-radius: 14px !important;
  box-shadow: 0 12px 36px rgba(40,30,20,.18) !important;

.leaflet-popup-content { margin: 12px 14px !important; line-height: 1.55 !important; }
.leaflet-control-attribution { font-size: 9px !important; opacity: .55; }
.leaflet-control-zoom {
  overflow: hidden;
  border: 0 !important;
  border-radius: 12px !important;
  box-shadow: 0 5px 20px rgba(38,27,18,.16) !important;
}
.leaflet-control-zoom a { border-color: rgba(40,30,20,.08) !important; }
.locate-btn {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 4px 16px rgba(40,30,20,.16);
  font-size: 17px;
  cursor: pointer;
}
@media (max-width: 390px) {
  .content { padding-left: 12px; padding-right: 12px; }
  .info-card { min-height: 96px; padding: 13px; }
  .btn { flex: 1 1 auto; }
}
</style>
</head>

const TYPE_EMOJI = { food: "🍽️", spot: "📍", drink: "🥛", hotel: "🏨", transport: "🚗" };
const TYPE_LABEL = { food: "餐", spot: "逛", drink: "甜", hotel: "住", transport: "行" };
const IN_APP_WEBVIEW = /micromessenger|xhs|discover\/|weibo|qq\/|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/i.test(navigator.userAgent || "");
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || "");

const locIndex = {};
DAYS.forEach(day => day.locations.forEach((loc, idx) => { locIndex[`${day.id}:${idx}`] = loc; }));

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[ch]);
}

function amapWebUrl(loc) {
  return `https://uri.amap.com/navigation?to=${loc.lng},${loc.lat},${encodeURIComponent(loc.name)}&mode=car&policy=1&src=trip-map&coordinate=wgs84&callnative=1`;
}
function amapAppUrl(loc) {
  const scheme = IS_IOS ? "iosamap" : "androidamap";
  return `${scheme}://navi?sourceApplication=trip-map&poiname=${encodeURIComponent(loc.name)}&lat=${loc.lat}&lon=${loc.lng}&dev=0&style=2`;
}
function openAmapKey(key) {
  const loc = locIndex[key];
  if (!loc || !loc.lat) return false;
  window.location.href = IN_APP_WEBVIEW ? amapWebUrl(loc) : amapAppUrl(loc);
  return false;
}
function dpUrl(loc) {
  const keyword = loc.dianpingKeyword || loc.name;
  return IN_APP_WEBVIEW
    ? `https://m.dianping.com/searchshop?keyword=${encodeURIComponent(keyword)}`
    : `dianping://searchshoplist?keyword=${encodeURIComponent(keyword)}`;
}
function xhsUrl(loc) {
  const keyword = loc.xhsKeyword || loc.name;
  return IN_APP_WEBVIEW
    ? `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}`
    : `xhsdiscover://search/result?keyword=${encodeURIComponent(keyword)}&target_search=notes&source=deeplink`;
}

const map = L.map("map", {
  center: [23.05, 113.42],
  zoom: 8,
  zoomControl: false,
  attributionControl: true
});
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap © CARTO"
}).addTo(map);

const LocateControl = L.Control.extend({
  options: { position: "bottomright" },
  onAdd() {
    const btn = L.DomUtil.create("button", "locate-btn");
    btn.innerHTML = "◎";
    btn.title = "定位我";
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener("click", () => map.locate({ setView: true, maxZoom: 15 }));
    return btn;
  }
});
new LocateControl().addTo(map);
let myMarker;
map.on("locationfound", e => {
  if (myMarker) myMarker.setLatLng(e.latlng);
  else myMarker = L.circleMarker(e.latlng, {
    radius: 7, color: "#fff", weight: 3, fillColor: "#1b73e8", fillOpacity: 1
  }).addTo(map).bindPopup("我的位置");
});

function pinIcon(color, emoji) {
  return L.divIcon({
    className: "",
    html: `<div style="width:30px;height:30px;border-radius:50%;background:${color};border:2.5px solid #fff;display:grid;place-items:center;font-size:14px;box-shadow:0 4px 14px rgba(40,30,20,.23)">${emoji}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -16]
  });
}
let mapLayers = [];
function clearMap() {
  mapLayers.forEach(layer => map.removeLayer(layer));
  mapLayers = [];
}
function addLayer(layer) {
  layer.addTo(map);
  mapLayers.push(layer);
  return layer;
}
function showDay(dayId) {
  clearMap();
  const points = [];
  if (dayId === 0) {
    DAYS.slice(1).forEach(day => {
      day.locations.forEach(loc => {
        if (!loc.lat || loc.time === "—") return;
        const marker = addLayer(L.circleMarker([loc.lat, loc.lng], {
          radius: 5, color: "#fff", weight: 2, fillColor: day.color, fillOpacity: .95
        }));
        marker.bindPopup(`<b>${escapeHtml(loc.name)}</b><br><span style="color:#716960">${escapeHtml(day.label)}</span>`);
        points.push([loc.lat, loc.lng]);
      });
    });
    if (points.length) map.fitBounds(points, { padding: [28, 28] });
    return;
  }

  const day = DAYS.find(item => item.id === dayId);
  if (!day) return;
  day.locations.forEach((loc, idx) => {
    if (!loc.lat) return;
    const marker = addLayer(L.marker([loc.lat, loc.lng], {
      icon: pinIcon(day.color, TYPE_EMOJI[loc.type] || "•")
    }));
    const nav = loc.nav === false ? "" :
      `<br><a href="${amapWebUrl(loc)}" onclick="return openAmapKey('${day.id}:${idx}')" style="color:#1b73e8;font-weight:700">高德驾车导航</a>`;
    marker.bindPopup(`<b>${escapeHtml(loc.name)}</b><br><span style="color:#716960">${escapeHtml(loc.time)}</span><br>${escapeHtml(loc.desc)}${nav}`);
    if (loc.time !== "—") points.push([loc.lat, loc.lng]);
  });
  if (points.length > 1) {
    addLayer(L.polyline(points, { color: day.color, weight: 2.7, opacity: .54, dashArray: "7,7" }));
  }
  if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 13 });
}

function chips(loc) {
  const values = [];
  if (loc.budget) values.push(loc.budget);
  if (loc.pay) values.push("微信 / 支付宝");
  return values.length ? `<div class="chips">${values.map(v => `<span class="chip">${escapeHtml(v)}</span>`).join("")}</div>` : "";
}
function links(loc, dayId, idx) {
  let html = "";
  if (loc.nav !== false && loc.lat) {
    html += `<a class="btn amap" href="${amapWebUrl(loc)}" onclick="return openAmapKey('${dayId}:${idx}')">🧭 高德驾车</a>`;
  }
  const dpEnabled = loc.dianping !== false && (loc.dianpingKeyword || loc.type === "food" || loc.type === "drink");
  if (dpEnabled) html += `<a class="btn dp" href="${dpUrl(loc)}">🍜 点评</a>`;
  if (loc.xhsKeyword) html += `<a class="btn xhs" href="${xhsUrl(loc)}">📕 小红书</a>`;
  return html ? `<div class="links">${html}</div>` : "";
}
function locationCard(loc, dayId, idx) {
  const type = loc.type || "transport";
  return `
  <div class="tl-item">
    <div class="tl-dot ${type}"></div>
    <article class="card">
      <div class="time">${loc.time === "—" ? "备选" : escapeHtml(loc.time)}</div>
      <div class="name"><span class="badge ${type}">${TYPE_LABEL[type] || "行"}</span>${escapeHtml(loc.name)}</div>
      <div class="desc">${escapeHtml(loc.desc)}</div>
      ${chips(loc)}
      ${links(loc, dayId, idx)}
      ${loc.detail ? `<div class="detail">${escapeHtml(loc.detail)}</div>` : ""}
    </article>
  </div>`;
}
function renderDay(dayId) {
  const day = DAYS.find(item => item.id === dayId);
  if (!day) return "";
  const main = day.locations.map((loc, idx) => ({ loc, idx })).filter(item => item.loc.time !== "—");
  const alt = day.locations.map((loc, idx) => ({ loc, idx })).filter(item => item.loc.time === "—");
  return `
    <header class="day-head">
      <div class="kicker">${escapeHtml(day.date)} · 参考路线</div>
      <h2>${escapeHtml(day.title)}</h2>
      <p>现实中的天气、路况、体力与饥饿程度优先。</p>
    </header>
    <div class="route-bar"><strong>路线</strong><br>${escapeHtml(day.route)}</div>
    <div class="section-head">当天安排</div>
    <div class="timeline">${main.map(item => locationCard(item.loc, day.id, item.idx)).join("")}</div>
    ${alt.length ? `<div class="section-head">位置待确认的备选</div><div class="timeline">${alt.map(item => locationCard(item.loc, day.id, item.idx)).join("")}</div>` : ""}
  `;
}
function overviewContent() {
  return `
    <header class="hero">
      <div class="eyebrow">2026.08.01—08.03 · 自驾吃喝</div>
      <h1>广州 · 顺德 · 汕头<br>三日吃喝地图</h1>
      <p>全程优先高德导航，跨城日不塞景点，周一为机场留足缓冲。</p>
      <a class="download" href="./itinerary.md">打开完整文字路书 →</a>
    </header>
    <section class="info-grid">
      <div class="info-card"><div class="label">周六</div><div class="value">顺德大良<br>三餐＋甜品＋夜宵</div></div>
      <div class="info-card"><div class="label">周日</div><div class="value">汕头往返<br>约 9 小时驾驶</div></div>
      <div class="info-card"><div class="label">周一航班</div><div class="value">20:30<br>白云机场 T3</div></div>
      <div class="info-card"><div class="label">硬截止</div><div class="value">18:30 T3还车<br>还完直接进站</div></div>
    </section>

    <div class="section-head">先看这三件事</div>
    <section class="callout danger">
      <strong>潮汕两顿火锅仍相隔 6 小时 45 分钟</strong>
      <p>15:10 的苏南勤记只吃鹅粉肝＋少量鹅肉小拼，不点饭和汤；亮记 11:45、创新土鸡 18:30，20:00 返广州。</p>
    </section>
    <section class="callout safe">
      <strong>周六甜品只加一碗，伴手礼买常温</strong>
      <p>英姑 → 民信双皮奶分食 → 水仙头 → 会龙居 → 正嘢家桑拿鸡/鱼。华盖路顺手买李禧记小包装蹦砂、南乳花生或鸡仔饼；鲜奶制品不在 8 月车里放两天。</p>
    </section>
    <section class="callout safe">
      <strong>周一不进广州老城</strong>
      <p>陈村吃完后直接北上到白云区午餐，再去机场，避开老城停车和跨城回头路。</p>
    </section>
    <section class="callout danger">
      <strong>住宿与还车区域都已固定</strong>
      <p>住宿为全季酒店广州黄埔南岗万达店；还车就在白云 T3。若订单注明具体停车楼、入口或车道，以订单为准。</p>
    </section>

    <div class="section-head">三天概览</div>
    <section class="day-list">
      ${DAYS.slice(1).map(day => `
        <button class="day-link" onclick="go(${day.id})">
          <span class="top"><span class="dot" style="background:${day.color}"></span>${escapeHtml(day.label)} · ${escapeHtml(day.title)}</span>
          <span class="sub">${escapeHtml(day.date)}</span>
        </button>`).join("")}
    </section>

    <div class="section-head">研究与核对</div>
    <section class="source-card">
      门店坐标与导航名已按高德核对；人均、排队与菜品信号参考近期大众点评/携程公开信息。
      广东 8 月暑热和阵雨都可能打乱节奏，出发当天早晨再看小时级天气与高德实时路况。
      <br><a href="https://www.gz.gov.cn/zwfw/zxfw/jtfw/content/post_10507494.html" target="_blank">白云机场 T3 官方交通信息</a>
      · <a href="https://www.autohome.com.cn/ask/23259796.html" target="_blank">广州—汕头车程参考</a>
    </section>
  `;
}

let currentDay = 0;
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
DAYS.forEach(day => {
  const btn = document.createElement("button");
  btn.className = "tab" + (day.id === 0 ? " active" : "");
  btn.dataset.day = day.id;
  btn.textContent = day.label;
  tabsEl.appendChild(btn);
});
function go(dayId) {
  currentDay = dayId;
  tabsEl.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", Number(tab.dataset.day) === dayId));
  contentEl.innerHTML = dayId === 0 ? overviewContent() : renderDay(dayId);
  showDay(dayId);
  window.scrollTo({ top: Math.max(0, document.getElementById("map").offsetHeight - 4), behavior: "smooth" });
  const activeTab = tabsEl.querySelector(`[data-day="${dayId}"]`);
  if (activeTab) activeTab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}
tabsEl.addEventListener("click", event => {
  const tab = event.target.closest(".tab");
  if (tab) go(Number(tab.dataset.day));
});

contentEl.innerHTML = overviewContent();
showDay(0);
</script>
</body>
